name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Test & Lint (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -l . | grep -v 'web/dist' || true)
          if [ -n "$DIFF" ]; then
            echo "Files not formatted properly:"
            echo "$DIFF"
            exit 1
          fi

      - name: Run Go Vet
        run: |
          go vet $(go list ./... | grep -v '/node_modules/')

      - name: Run Go Unit Tests
        run: |
          go test -v -race $(go list ./... | grep -v '/node_modules/')

  frontend-ci:
    name: Frontend Test & Lint (Vue 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Check code formatting (Prettier)
        working-directory: ./web
        run: npm run format:check

      - name: Run Linter (ESLint)
        working-directory: ./web
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        working-directory: ./web
        run: npm run test

      - name: Build Frontend
        working-directory: ./web
        run: npm run build

  docker-build:
    name: Docker Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t neraca:test .

