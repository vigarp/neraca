name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend Test & Lint (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -l . | grep -v 'web/dist' || true)
          if [ -n "$DIFF" ]; then
            echo "Files not formatted properly:"
            echo "$DIFF"
            exit 1
          fi

      - name: Run Go Vet
        run: |
          go vet $(go list ./... | grep -v '/node_modules/')

      - name: Run Go Unit Tests
        run: |
          go test -v -race $(go list ./... | grep -v '/node_modules/')

  frontend-ci:
    name: Frontend Test & Lint (Vue 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Check code formatting (Prettier)
        working-directory: ./web
        run: npm run format:check

      - name: Run Linter (ESLint)
        working-directory: ./web
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        working-directory: ./web
        run: npm run test

      - name: Build Frontend
        working-directory: ./web
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS Kathmandu
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/home/ubuntu/apps/neraca/.git" ]; then
              git clone git@github.com:vigarp/neraca.git /home/ubuntu/apps/neraca
            fi
            cd /home/ubuntu/apps/neraca
            git pull origin main
            cp compose.prod.yml compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
