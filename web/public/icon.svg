<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neraca-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#neraca-grad)" />

  <!-- Balance Scale (Neraca) Icon in White -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Pillar -->
    <line x1="256" y1="128" x2="256" y2="400" />
    <line x1="176" y1="400" x2="336" y2="400" />
    
    <!-- Top Beam -->
    <line x1="128" y1="176" x2="384" y2="176" />
    <circle cx="256" cy="144" r="16" fill="#ffffff" />

    <!-- Left Pan Strings -->
    <line x1="128" y1="176" x2="80" y2="280" />
    <line x1="128" y1="176" x2="176" y2="280" />
    <!-- Left Pan -->
    <path d="M72 280 Q128 320 184 280 Z" fill="#ffffff" fill-opacity="0.2" />

    <!-- Right Pan Strings -->
    <line x1="384" y1="176" x2="336" y2="280" />
    <line x1="384" y1="176" x2="432" y2="280" />
    <!-- Right Pan -->
    <path d="M328 280 Q384 320 440 280 Z" fill="#ffffff" fill-opacity="0.2" />
  </g>
</svg>

